schema_version: 1

context:
  name: pyfastspm
  version: "1.0.6"
  python_min: '3.8'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c768a83fa90625473ac7ddfb05b7760c6a7061aa7f0f1598ab19759c1ff6a8c5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools_scm
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - numpy
    - scipy
    - scikit-image
    - matplotlib-base
    - pillow
    - tqdm
    - h5py
    - packaging
    - ffmpeg

tests:
  - python:
      imports:
        - pyfastspm
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: MIT AND Apache-2.0
  license_file: LICENSE
  summary: A python package for loading, processing and exporting scanning probe microscopy movies acquired with the FAST unit.
  homepage: http://fastspm.gitlab.io/pyfastspm/
  repository: https://gitlab.com/fastspm/pyfastspm/
  documentation: http://fastspm.gitlab.io/pyfastspm/

extra:
  recipe-maintainers:
    - carlodri
    - mpanighel
